worker_processes 1;

error_log logs/lb-error.log;
pid logs/lb-nginx.pid;

events {
  worker_connections 1024; # chịu tải 1024 kết nối đồng thời
}

http {
  include C:/nginx/conf/mime.types;
  default_type application/octet-stream;

  access_log logs/lb-access.log;

  # Upstream: 2 Node instance — ip_hash = sticky theo IP client
  # (ip_hash băm theo IP client để 1 client luôn dính (sticky) vào cùng 1
  #  server 5001 hoặc 5002. Nếu không có, request polling/websocket của cùng
  #  1 user sẽ nhảy lung tung giữa 2 server -> handshake thất bại, disconnect liên tục.)
  upstream socket_backend {
    ip_hash;
    server 127.0.0.1:5001;
    server 127.0.0.1:5002;
  }

  server {
    listen 5000;

    # Tăng timeout cho long-polling + websocket
    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;

    location / {
      proxy_pass http://socket_backend;

      # BẮT BUỘC cho websocket upgrade
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Giữ IP thật của client (để ip_hash + log đúng)
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      proxy_set_header Origin $http_origin;
    }
  }
}
